<!DOCTYPE html>

<style>
    .logo
    {
        width:3%;

    html

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
    overflow-x: hidden;
}

.navbar {
    background-color: #000000;
    color: white;
    padding: 20px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}



.nav-links {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    margin-left:2%;
}

.nav-links li {
    padding: 10px 15px;
    position: relative; 
    font-size:25px;
    margin:2%;
}

.nav-links a {
    color: white;
    text-decoration: none;
    display: block;
}

/* ➡️ ड्रॉपडाउन मेनू स्टाइलिंग */
.dropdown-content {
    display: none; /* डिफ़ॉल्ट रूप से छिपा हुआ */
    position: absolute;
    background-color: #444;
    min-width: 160px;
    z-index: 1;
    list-style: none;
    padding: 0;
    margin-top: 10px;
    box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
    border-radius: 4px;
}

.dropdown-content li {
    padding: 0;
}

.dropdown-content a {
    color: white;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
    text-align: left;
}

.dropdown-content a:hover {
    background-color: #555;
}


.dropdown:hover .dropdown-content {
    display: block;
}


#menu-toggle, .menu-icon {
    display: none; 
}



.logo
{
width:5%;
position:absolute;

padding:10px;
top:0.5%;
left:50%;
}

.pic
{
    width:100%;
    height:800px;
}
#button-top
{
 position:absolute;
 left:90%;
 top:6%;
 border:1px solid white;
 width:7%;
 text-align:center;
 font-size:25px;
background:transparent;
color:white;
height:


    
}

#button-top:hover
{
    color:black;
    background:white;
    cursor:pointer;
}



#btn-head
{

position:absolute;
    top:110%;
    left:45%;
     width:12%;
       border:1px solid white;
      
    
      
}

#btn-head:hover
{

background:rgb(136, 130, 130);
cursor:pointer;
}

.btn
{
   
    
    font-size:15px;
    width:100%;
  text-align:center;
}



.btn a:link
{
color:white;
text-decoration:none;
font-size:20px;
}

.btn a:visited
{
color:white;
}

.btn a:hover
{

color:black;

}

.btn a:active
{
color: red;

}
@media screen and (max-width: 768px) {
    .navbar {
        flex-wrap: wrap;
    }
    
    .menu-icon {
        display: block; 
        font-size: 2em;
        cursor: pointer;
    }

    .nav-links {
        width: 100%;
        flex-direction: column; 
        display: none; 
        text-align: center;
        background-color: #3e3e3e; 
    }

    .nav-links li {
        padding: 0;
        border-top: 1px solid #444;
    }
    
    .nav-links a {
        padding: 15px; 
    }

    
    #menu-toggle:checked + .menu-icon + .nav-links {
        display: flex;
    }

    
    .dropdown-content {
        background-color: #555;
        box-shadow: none;
        width: 100%;
        margin: 0;
    }
    
    
    .dropdown:hover .dropdown-content {
        display: block;
    }

    .logo
{
width:10%;

#btn-head:hover
{

background:rgb(136, 130, 130);
cursor:pointer;
}

{

color:rgb(7, 5, 5);

}

.btn a:active
{
color: red;

}
    
}
